<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台管理 — 常民竹小屋</title>
<style>
:root{
  --paper:   #fbfaf8;
  --ink:     #201f1d;
  --muted:   #8a8781;
  --line:    #eae7e1;
  --accent:  #6b6355;
  --danger:  #b23b3b;
  --f-heading: 'Trebuchet MS', 'Yu Gothic', 'Meiryo', sans-serif;
  --f-body:    'Yu Gothic Light', 'Yu Gothic', 'Meiryo', sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; display:block; }
a{ color:inherit; }
button{ font-family:inherit; cursor:pointer; }
h1,h2,h3{ font-family:var(--f-heading); font-weight:700; letter-spacing:-0.01em; margin:0; }
input,textarea,select{ font-family:inherit; font-size:14px; }

.wrap{ max-width:1000px; margin:0 auto; padding:0 24px; }
.top-bar{ border-bottom:1px solid var(--line); padding:18px 0; margin-bottom:28px; }
.top-bar .wrap{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.top-bar .site-title{ font-family:var(--f-heading); font-weight:700; font-size:18px; }
.top-bar .site-title a{ text-decoration:none; color:var(--muted); font-weight:400; font-size:13px; margin-left:10px; }
.top-bar .user-box{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }

.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:9px 16px; border-radius:5px; border:1px solid var(--line);
  background:#fff; color:var(--ink); font-size:13.5px; font-weight:600;
  transition:all .15s ease;
}
.btn:hover{ border-color:var(--ink); }
.btn.primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
.btn.primary:hover{ background:#000; }
.btn.danger{ color:var(--danger); border-color:#e6c9c9; }
.btn.danger:hover{ background:#fdf1f1; border-color:var(--danger); }
.btn.ghost{ border-color:transparent; background:none; color:var(--muted); padding:9px 10px; }
.btn.ghost:hover{ color:var(--ink); }
.btn.small{ padding:6px 12px; font-size:12.5px; }
.btn:disabled{ opacity:.5; cursor:default; }

.login-screen{
  min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px; text-align:center; padding:40px 20px;
}
.login-screen h1{ font-size:24px; }
.login-screen p{ color:var(--muted); max-width:360px; font-size:14px; line-height:1.7; }
.login-screen input{
  width:260px; padding:10px 12px; border:1px solid var(--line); border-radius:5px;
  background:#fff; color:var(--ink); font-size:14px;
}
.login-screen input:focus{ outline:none; border-color:var(--ink); }

.list-section-title{ font-family:var(--f-heading); font-weight:700; font-size:13px; letter-spacing:.02em; margin-bottom:14px; color:var(--ink); }
.item-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:20px; padding-bottom:60px; }
.item-card{
  border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer;
  background:#fff; transition:box-shadow .15s ease, transform .15s ease;
}
.item-card:hover{ box-shadow:0 6px 18px rgba(32,31,29,0.1); transform:translateY(-2px); }
.item-card .thumb{ position:relative; aspect-ratio:4/3; background:#efece5; overflow:hidden; }
.item-card .thumb img{ width:100%; height:100%; object-fit:cover; }
.item-card .thumb.empty{ display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; }
.item-card .info{ padding:12px 14px; }
.item-card .info .t{ font-size:14px; font-weight:600; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-card .info .m{ font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:6px; }
.pill{ display:inline-flex; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
.pill.on{ background:rgba(57,255,20,0.15); color:#1f7a10; }
.pill.off{ background:rgba(178,59,59,0.1); color:var(--danger); }

.editor{ padding-bottom:80px; }
.editor-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; gap:12px; flex-wrap:wrap; }
.back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13.5px; background:none; border:none; padding:0; }
.back-link:hover{ color:var(--ink); }

.field-block{ margin-bottom:26px; }
.field-block > label, .field-block > .label{
  display:block; font-family:var(--f-heading); font-weight:700; font-size:13px;
  letter-spacing:.02em; margin-bottom:8px; color:var(--ink);
}
.field-hint{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.6; }
.field-block input[type=text], .field-block input[type=number], .field-block input[type=color], .field-block textarea, .field-block select{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:5px;
  background:#fff; color:var(--ink); resize:vertical;
}
.field-block input:focus, .field-block textarea:focus, .field-block select:focus{ outline:none; border-color:var(--ink); }
.field-block textarea{ min-height:90px; line-height:1.7; }
.field-block textarea.tall{ min-height:220px; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.three-col{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.four-col{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
@media (max-width:640px){ .two-col, .three-col, .four-col{ grid-template-columns:1fr; } }
.checkbox-row{ display:flex; align-items:center; gap:8px; font-size:13.5px; }

.chapter-section{ border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin-bottom:20px; background:#fff; }
.chapter-section-head{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.chapter-section-head .num{
  display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%;
  background:var(--ink); color:#fff; font-size:12px; font-weight:700; flex-shrink:0;
}
.chapter-section-head .key{ font-size:11px; color:var(--muted); font-family:monospace; }
.photo-cap-hint{ font-size:12px; color:var(--muted); margin-bottom:10px; }
.photo-cap-hint.over{ color:var(--danger); }

.photo-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
.photo-row{ display:flex; gap:12px; align-items:center; }
.photo-row .thumb{ width:84px; height:63px; flex-shrink:0; border-radius:5px; overflow:hidden; background:#efece5; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--muted); text-align:center; }
.photo-row .thumb img{ width:100%; height:100%; object-fit:cover; }
.photo-row .fields{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
.photo-row .fields input{ width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:5px; font-size:12.5px; }
.photo-row .fields select{ width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:5px; font-size:12.5px; background:#fff; }
.row-remove-btn{
  flex-shrink:0; width:32px; height:32px; border-radius:50%; border:1px solid var(--line);
  background:#fff; color:var(--muted); font-size:16px; line-height:1;
}
.row-remove-btn:hover{ color:var(--danger); border-color:var(--danger); }
/* 「影片」章節的影片清單：每支影片之間留間距、加分隔線，才看得出哪個標題配哪個網址 */
.video-list{ display:flex; flex-direction:column; gap:14px; }
.video-list .photo-row + .photo-row{ border-top:1px solid var(--line); padding-top:14px; }
/* 本機模式提示條（見 LOCAL_MODE） */
.local-mode-banner{
  background:#1f6f43; color:#fff; font-size:13px; font-weight:600; text-align:center;
  padding:8px 16px; letter-spacing:.02em;
}
/* 調整順序：左側拖曳把手＋右側上／下移按鈕 */
.row-drag-handle{
  flex-shrink:0; width:20px; align-self:stretch; display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:16px; cursor:grab; user-select:none;
}
.row-drag-handle:hover{ color:var(--ink); }
.row-move{ flex-shrink:0; display:flex; flex-direction:column; gap:4px; }
.row-move-btn{
  width:28px; height:22px; border-radius:5px; border:1px solid var(--line);
  background:#fff; color:var(--muted); font-size:12px; line-height:1;
}
.row-move-btn:hover:not(:disabled){ color:var(--ink); border-color:var(--ink); }
.row-move-btn:disabled{ opacity:.3; cursor:default; }
.photo-row.dragging{ opacity:.4; }
.photo-row.drop-before{ box-shadow:0 -3px 0 var(--ink); }
.photo-row.drop-after{ box-shadow:0 3px 0 var(--ink); }
.add-photo-btn{
  align-self:flex-start; display:inline-flex; align-items:center; gap:8px;
  padding:9px 14px; border-radius:6px; border:1.5px dashed var(--line); background:none; color:var(--muted); font-size:13px; font-weight:600;
}
.add-photo-btn:hover{ border-color:var(--ink); color:var(--ink); }
.add-card{
  border:1.5px dashed var(--line); border-radius:8px; aspect-ratio:4/3;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  color:var(--muted); cursor:pointer; background:none;
}
.add-card:hover{ border-color:var(--ink); color:var(--ink); }
.add-card span{ font-size:13px; font-weight:600; }

.save-bar{
  position:sticky; bottom:0; margin-top:32px; padding:16px 0; background:var(--paper);
  border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
}
.save-status{ font-size:12.5px; color:var(--muted); }
.save-status.err{ color:var(--danger); }

#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:6px; font-size:13.5px;
  opacity:0; pointer-events:none; transition:all .25s ease; z-index:999; max-width:90vw; text-align:center;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
#toast.err{ background:var(--danger); }

#loadingOverlay{
  position:fixed; inset:0; background:rgba(251,250,248,0.85); backdrop-filter:blur(2px);
  display:none; align-items:center; justify-content:center; z-index:998; font-size:14px; color:var(--muted);
}
#loadingOverlay.show{ display:flex; }
.spinner{
  width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--ink);
  animation:spin .7s linear infinite; display:inline-block; margin-right:8px; vertical-align:-3px;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="loadingOverlay"><span class="spinner"></span><span id="loadingText">處理中…</span></div>
<div id="toast"></div>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   設定
   ============================================================
   這支後台跟 as-studio001/Internal-Pages 的 admin/index.html 共用同一套
   後端基礎設施——同一個 Supabase 專案（同一批登入使用者／同一套 Auth）、
   同一組 Netlify Functions（github-proxy／invite-user／list-users／
   remove-user），不重新申請、不重新建置。這裡只是另外一支獨立的前端
   操作介面（獨立的 HTML／網址），寫回的目標 repo 換成這個專案自己
   （as-studio001/bamboo），不是 Internal-Pages 那個 repo。
   SUPABASE_URL／SUPABASE_ANON_KEY 是公開用的值（Supabase 官方設計上
   anon key 本來就會放在前端程式碼裡，不是密鑰，這兩個值直接照抄
   Internal-Pages 那邊目前線上真正在用的值）。FUNCTIONS_BASE 一樣。
   要讓這支後台真的能寫回 bamboo 這個 repo，Internal-Pages 那支共用的
   netlify/functions/github-proxy.js 的 ALLOWED_REPOS 白名單需要加上
   "bamboo"（已經在 Internal-Pages repo 那邊處理，不是這個檔案的事）。
*/
let AUTH_LINK_TYPE = (/type=(invite|recovery)/.exec(location.hash) || [])[1] || null;

// 跨後台切換時「同一次登入兩邊通用」用的交接參數——見下面 crossAdminUrl()／init() 的說明。
// 一定要在 supabase.createClient() 之前就先讀走，理由跟上面 AUTH_LINK_TYPE 一樣：
// supabase-js 自己也會偵測網址 hash 來建立 session、建立完會把 hash 清掉，如果我們自己的
// 判斷邏輯等 createClient 呼叫完才去讀，常常會讀到已經被清空的網址。
const _handoffHash = new URLSearchParams(location.hash.replace(/^#/, ""));
const HANDOFF_ACCESS_TOKEN = _handoffHash.get("handoff_at");
const HANDOFF_REFRESH_TOKEN = _handoffHash.get("handoff_rt");

const REPO_OWNER = "as-studio001";
const REPO_NAME = "bamboo";
const REPO_BRANCH = "main";

const SUPABASE_URL = "https://enjbqfgepvkpwlfqbldi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVuamJxZmdlcHZrcHdsZnFibGRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTUyODQsImV4cCI6MjEwMjg3MTI4NH0.7YAlMUGocaXenA6RPdDPNu60g48GgW0Nq8xAwxThilo";
const FUNCTIONS_BASE = "https://zingy-bonbon-36e6c9.netlify.app/.netlify/functions";

// 本機模式（2026-10-14）：在自己電腦上用 npm run dev 開 localhost:3000/admin 時，讀寫、上傳都改走
// 本機的 /api/local-content（src/app/api/local-content/route.ts），直接改這台電腦上的 content/ 跟
// public/images——不上傳 GitHub、不觸發 Vercel 重新部署；本機網站自動更新，後台跟網頁即時連動。
// 正式網站（bamboo-sage.vercel.app/admin）不受影響，照舊寫 GitHub。登入還是一樣要登入。
const LOCAL_MODE = ["localhost", "127.0.0.1"].includes(location.hostname);

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function esc(str){
  return String(str == null ? "" : str).replace(/[&<>"']/g, s => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[s]));
}
function uid(){ return Math.random().toString(36).slice(2, 9); }

/* ============================================================
   Toast / loading
   ============================================================ */
let toastTimer = null;
function toast(msg, isErr){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.toggle("err", !!isErr);
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), isErr ? 15000 : 3200);
}
function setLoading(on, text){
  document.getElementById("loadingText").textContent = text || "處理中…";
  document.getElementById("loadingOverlay").classList.toggle("show", !!on);
}

/* ============================================================
   Auth（跟 Internal-Pages 共用同一個 Supabase 專案／同一批使用者，
   邀請新人／重設密碼一律在 Internal-Pages 那邊的「使用者管理」分頁做，
   這裡不重複做一份使用者管理介面）
   ============================================================ */
let authSession = null;
sb.auth.onAuthStateChange((_event, session) => { authSession = session; });

async function callFunction(name, payload){
  // 本機模式：github-proxy 的讀寫動作改送本機 API（格式相同）
  const url = LOCAL_MODE && name === "github-proxy" ? "/api/local-content" : `${FUNCTIONS_BASE}/${name}`;
  const res = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + (authSession ? authSession.access_token : ""),
    },
    body: JSON.stringify(payload || {}),
  });
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    const ctxParts = [];
    if(payload && payload.action) ctxParts.push(payload.action);
    if(payload && payload.path) ctxParts.push(payload.path);
    const ctx = ctxParts.length ? `[${ctxParts.join(" ")}] ` : "";
    throw new Error(ctx + (data.error || (res.status + " " + res.statusText)));
  }
  return data;
}

function logout(){
  sb.auth.signOut();
  authSession = null;
  state.user = null;
  render();
}

/* ============================================================
   GitHub 讀寫（比照 Internal-Pages：公開 repo 直接打 GitHub API 讀，
   讀取失敗才退回 github-proxy；寫入一律經過 github-proxy，因為那需要
   服務帳號的 token，登入的人不會有自己的 GitHub 帳號）
   ============================================================ */
function utf8ToBase64(str){ return btoa(unescape(encodeURIComponent(str))); }
function decodeGhFileData(data){
  const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ""))));
  return { sha: data.sha, content };
}
async function ghFetchPublic(path){
  if(LOCAL_MODE) return null; // 本機模式不讀 GitHub，一律走 callFunction → 本機 API
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path.split("/").map(encodeURIComponent).join("/")}?ref=${REPO_BRANCH}&_=${Date.now()}`;
  try{ return await fetch(url, { cache: "no-store" }); }catch(e){ return null; }
}
async function ghGetFile(path){
  const res = await ghFetchPublic(path);
  const data = (res && res.ok) ? await res.json() : await callFunction("github-proxy", { action: "getFile", path, repo: REPO_NAME });
  const { sha, content } = decodeGhFileData(data);
  return { sha, content, json: JSON.parse(content) };
}
// 跟 ghGetFile 一樣，但檔案在 GitHub 上還不存在（404）時回傳 null，不丟錯——給「展覽共用
// 區塊」這類單一 JSON 檔用：檔案還沒建立時用預設值打開編輯畫面，存檔時（不帶 sha）會新建檔案。
async function ghGetFileOrNull(path){
  if(LOCAL_MODE){
    try{ return await ghGetFile(path); }
    catch(e){ if(/找不到檔案/.test(e.message)) return null; throw e; }
  }
  const res = await ghFetchPublic(path);
  if(res && res.status === 404) return null;
  return ghGetFile(path);
}
async function ghListDir(path){
  const res = await ghFetchPublic(path);
  if(res && res.status === 404) return [];
  if(res && res.ok) return res.json();
  return callFunction("github-proxy", { action: "listDir", path, repo: REPO_NAME });
}
async function ghPutFile(path, base64Content, message, sha){
  return callFunction("github-proxy", { action: "putFile", path, content: base64Content, message, sha, repo: REPO_NAME });
}
async function ghDeleteFile(path, message, sha){
  return callFunction("github-proxy", { action: "deleteFile", path, message, sha, repo: REPO_NAME });
}

function readFileAsBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
/* 上傳前先縮圖＋重新壓縮成 JPEG——相機原始檔案動輒好幾 MB，GitHub API
   又要求轉成 base64（體積再漲 1/3），不壓縮上傳會很慢。GIF／SVG／已經
   夠小的檔案直接用原檔，不為了壓縮反而讓小檔案變大或弄丟動畫。 */
function compressImageFile(file, maxDimension, quality){
  return new Promise((resolve) => {
    if(!file.type || !file.type.startsWith("image/") || file.type === "image/svg+xml" || file.type === "image/gif"){
      resolve(file); return;
    }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxDimension / Math.max(img.naturalWidth, img.naturalHeight));
      if(scale >= 1 && file.size < 1.5 * 1024 * 1024){ resolve(file); return; }
      const width = Math.max(1, Math.round(img.naturalWidth * scale));
      const height = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => {
        if(!blob){ resolve(file); return; }
        const newName = file.name.replace(/\.\w+$/, "") + ".jpg";
        resolve(new File([blob], newName, { type: "image/jpeg" }));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
// （2026-10-16）.jfif／.jpe 這類 JPEG 的冷門副檔名統一改成 .jpg——Vercel 不認得 .jfif，會用
// application/octet-stream 送出，網站的圖片最佳化（next/image）因此回 400、正式網站上圖片顯示不出來
// （竹輕亭設計單位「初樸」的照片就是這樣）；本機開發伺服器剛好能顯示，所以只有上線後才看得到問題。
function sanitizeFilename(name){
  return name.replace(/[^\w.\-一-鿿]+/g, "_").replace(/\.(jfif|jpe|pjpeg|pjp)$/i, ".jpg");
}

// 單一檔案上傳大小上限——Netlify Function 本身收 request body 有實際上限
// （約 6MB），留一點餘裕訂在 4MB，跟 Internal-Pages 現在的後台（admin/index.html
// 的 MAX_UPLOAD_BYTES）用同一個數字。超過這個大小先在瀏覽器端擋掉、給清楚的
// 錯誤訊息，不要讓請求送出去才卡住、或在後端失敗後丟一段看不懂的技術錯誤。
// （已修正，2026-10-01：影片／GIF 上傳失敗——根本原因是這個檔案原本完全沒有
// 大小防呆，超過 MAX_UPLOAD_BYTES 的檔案會直接送出去，卡在 Netlify／GitHub
// 那端才失敗，使用者只看到「上傳失敗」四個字猜不出原因。）
const MAX_UPLOAD_BYTES = 4 * 1024 * 1024;
// GitHub「Create/Update file contents」這支 API（uploadAsset 預設走的路徑）
// 單檔內容實際上限大約 1MB（官方文件寫的，base64 編碼又會再膨脹 1/3，門檻抓
// 保守一點）。一般照片已經過 compressImageFile 壓縮，通常遠低於這個門檻；
// 影片完全沒壓縮、GIF 也跳過壓縮（compressImageFile 裡特別排除），這兩種
// 檔案很容易超過——超過這個門檻但還在 MAX_UPLOAD_BYTES 以內的話，改傳
// useBlob:true，讓 github-proxy.js 改走 Git Data API（uploadViaBlob()，見
// 那支 function 的註解），不受 Contents API 這個較小的單檔上限限制，這是
// github-proxy.js 本來就支援、一直沒被這裡用到的路徑。
const CONTENTS_API_LIMIT_BYTES = 900 * 1024;

function assertUploadSize(file){
  if(file.size > MAX_UPLOAD_BYTES){
    const mb = (file.size / 1024 / 1024).toFixed(1);
    throw new Error(`檔案太大（${mb}MB）：單一檔案上傳大小上限約 4MB。照片通常會先自動壓縮到遠低於這個門檻，會擋到這裡多半是影片／GIF 檔，請先剪短或壓縮後再上傳。`);
  }
}

/* 上傳一張照片／影片到 public/images/<slug>/，回傳存進 ProjectImage.src
   要用的網址（開頭 /images/...，Next.js 會直接從 public/ 底下用同樣的
   相對路徑供應這個檔案，不用寫 "/public" 這個前綴）。影片檔（video/*）
   不經過壓縮，圖片才壓。 */
async function uploadAsset(file, slug){
  const isVideo = file.type && file.type.startsWith("video/");
  const compressed = isVideo ? file : await compressImageFile(file, 2400, 0.82);
  assertUploadSize(compressed);
  const filename = sanitizeFilename(compressed.name);
  const b64 = await readFileAsBase64(compressed);
  const folder = `public/images/${slug}`;
  const useBlob = compressed.size > CONTENTS_API_LIMIT_BYTES;
  const data = await callFunction("github-proxy", { action: "uploadAsset", folder, filename, content: b64, repo: REPO_NAME, useBlob });
  return "/" + data.path.replace(/^public\//, "");
}

  editingEvents: null, // { item, sha }——「活動」（整個展覽共用，content/events.json）編輯畫面
  editingManifesto: null, // { item, sha }——「策展宣言」（整個展覽共用，content/manifesto.json）編輯畫面
  editingChapters: null, // { item, sha }——「章節標題」（兩案共用，content/chapters.json）編輯畫面

async function loadCaseList(){
  const entries = await ghListDir("content/projects");
  const files = entries.filter(e => e.type === "file" && e.name.endsWith(".json"));
  const items = await Promise.all(files.map(async f => {
    try{
      const { json } = await ghGetFile(f.path);
      const thumb = (json.coverImages || []).find(c => c.src && c.id === effectiveHomeCoverId(json));
      return { slug: json.slug || f.name.replace(/\.json$/, ""), name: json.name || "", published: json.published !== false, thumb: thumb ? thumb.src : "" };
    }catch(e){
      return { slug: f.name.replace(/\.json$/, ""), name: "（讀取失敗）", published: true, thumb: "" };
    }
  }));
  state.cases = items;
}

}

// INTERNAL_PAGES_ADMIN_URL：原型建築（as-studio001/Internal-Pages）自己的後台網址，跟
// 這裡共用同一個 Supabase 專案／同一批登入使用者（見這個檔案最上面的設定說明）。兩邊
// 後台各自是獨立部署（這裡是 bamboo 專案的 /admin，原型建築是它自己 GitHub Pages 上的
// admin/index.html），不是同一個網站的兩個分頁——不同網域瀏覽器本來就會各自存一份登入
// 狀態，直接整頁導覽過去的話，沒登入過那個網域還是要重新輸入帳密一次。
//
// 解法是「登入交接」：點連結的當下，把這個分頁目前手上的 Supabase session（access
// token／refresh token）直接帶在目的網址的 hash 上一起過去（crossAdminUrl()），對面
// 那支後台開頭一偵測到網址帶了這兩個參數，就直接拿去呼叫 supabase-js 的
// setSession()，等於直接「換上」這個 session，不用重新輸入帳密——效果上就是「同一次
// 登入兩邊通用」。這個做法沿用 Supabase 自己邀請信／忘記密碼連結本來就在用的模式（同樣
// 是把 token 放在網址 hash 帶過去，hash 不會送到伺服器，只有接收端的 JS 讀得到），不是
// 另外發明一套；接收端讀完會立刻把 hash 從網址列清掉（見 init()），不會讓 token 留在
// 網址列或瀏覽紀錄裡太久。
// 兩邊都沒有登入中的 session（例如根本還沒登入）時，crossAdminUrl() 就只回傳原始網址，
// 對面一樣會照平常顯示登入畫面，不會出錯。
function crossAdminUrl(baseUrl){
  if(authSession && authSession.access_token && authSession.refresh_token){
    const at = encodeURIComponent(authSession.access_token);
    const rt = encodeURIComponent(authSession.refresh_token);
    return `${baseUrl}#handoff_at=${at}&handoff_rt=${rt}`;
  }
  return baseUrl;
}

   章節標題（兩案共用一份）

   兩組名稱（2026-10-14 起）：
   labels：首頁頂部選單的短名（只有會出現在首頁的章節＋「活動」），活動區塊標題也用這裡的「活動」
   titles：案例內頁的完整章節名稱（8 章），案例內頁標題、獨立頁左側直書導覽用
   留空就用預設名稱。
   navColor：只套用在首頁頂部選單的文字顏色，空字串＝沿用頁面本身的黑色。
   （2026-10-13 取消深色模式後只剩一個顏色，為了相容已存的資料仍存在
   navColor.light；舊資料裡的 navColor.dark 下次存檔時會被拿掉。）
*/
// 首頁選單短名：label 是預設值，chapter 是對應到哪一章（顯示在欄位標題，方便對照）
const LABEL_DEFS = [
  { key: "design", label: "設計", chapter: "設計概念" },
  { key: "module", label: "模矩", chapter: "建築設計" },
  { key: "structure", label: "構造", chapter: "細部設計" },
  { key: "construction", label: "施工", chapter: "施工細節" },
  { key: "finished", label: "成品", chapter: "成品照片" },
  { key: "assembly", label: "組裝", chapter: "組裝說明書" },
  { key: "site", label: "位置", chapter: "基地位置" },
  // 「影片」只在案例內頁，首頁選單沒有，所以這裡不列（內頁名稱在下方「案例內頁的章節名稱」）
  { key: "events", label: "活動", chapter: "首頁活動畫面" },
];
// 案例內頁完整名稱：預設值跟案例編輯器的章節名稱（CHAPTER_DEFS）相同。寫成函式而不是常數——
// CHAPTER_DEFS 在檔案後面才宣告，頂層直接讀會在載入時出錯（const 的暫時性死區）。
function titleDefs(){ return CHAPTER_DEFS.map(d => ({ key: d.key, label: d.label })); }
const NAV_COLOR_DEFS = [
  { key: "light", label: "文字顏色", fallback: "#171412" },
];

async function openChaptersEditor(){
  try{
    setLoading(true, "載入章節標題中…");
    const { json, sha } = (await ghGetFileOrNull("content/chapters.json")) || { json: {}, sha: undefined };
    const labels = {};
    LABEL_DEFS.forEach(d => { labels[d.key] = (json.labels && json.labels[d.key]) || d.label; });
    const titles = {};
    titleDefs().forEach(d => { titles[d.key] = (json.titles && json.titles[d.key]) || d.label; });
    const navColor = { light: (json.navColor && json.navColor.light) || "" };
    state.editingChapters = { item: { labels, titles, navColor }, sha };
    render();
  }catch(err){
    toast(err.message || "載入失敗", true);
  }finally{
    setLoading(false);
  }
}

async function saveChaptersEditor(ed){
  const statusEl = document.getElementById("saveStatus");
  const item = ed.item;
  LABEL_DEFS.forEach(d => { item.labels[d.key] = (item.labels[d.key] || "").trim() || d.label; });
  titleDefs().forEach(d => { item.titles[d.key] = (item.titles[d.key] || "").trim() || d.label; });

/* ============================================================
   策展宣言（整個展覽共用一份，首頁第一個畫面）
   ============================================================
   對應 content/manifesto.json（前台 src/lib/manifesto.ts 讀這個檔案）。
   （2026-10-15）宣言改成首頁最上面的五個連續畫面，每一屏一個物件：
   cover（封面）、statement（一句話主張＋NOT／NOT／BUT）、formula（A＋B＝？）、
   counts（數字＋竹構生成鏈）、closing（系統提供可能，業主決定結果）。
   欄位用 data-mf="路徑"（例如 statement.contrasts.0.text）直接綁到 item；
   生成鏈用 data-mf-lines（一行一個步驟）。文字裡的換行前台會原樣保留，留空的欄位前台不顯示。
*/
function mfNormalize(json){
  const m = Object.assign({ eyebrow: "" }, json);
  m.cover = Object.assign({ label: "", title: "", subtitle: "", tagline: "", credit: "", notes: "", image: "", figure: "" }, m.cover);
  m.statement = Object.assign({ label: "", title: "", body: "", contrasts: [] }, m.statement);
  while(m.statement.contrasts.length < 3) m.statement.contrasts.push({ label: m.statement.contrasts.length < 2 ? "Not" : "But", text: "" });
  m.formula = Object.assign({ label: "", note: "", terms: [] }, m.formula);
  while(m.formula.terms.length < 3) m.formula.terms.push({ symbol: ["A", "B", "?"][m.formula.terms.length], title: "", subtitle: "", en: "" });
  m.counts = Object.assign({ label: "", title: "", body: "", items: [], chainLabel: "", chain: [] }, m.counts);
  m.closing = Object.assign({ label: "", title: "", emphasis: "", from: "", to: "", shiftBody: "", variables: "", variablesBody: "" }, m.closing);
  m.bridge = Object.assign({ label: "", title: "", points: "", quote: "", divider: "" }, m.bridge);
  m.bridge.intros = Object.assign({}, m.bridge.intros);
  (state.cases || []).forEach(c => { if(!(c.slug in m.bridge.intros)) m.bridge.intros[c.slug] = ""; });
  return m;
}

function mfGet(obj, path){
  return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
function mfSet(obj, path, value){
  const keys = path.split(".");
  const last = keys.pop();
  const target = keys.reduce((o, k) => o[k], obj);
  target[last] = value;
}

}

// 存檔前整理：字串去頭尾空白、統一換行；生成鏈去掉空行；數字列整列空白的拿掉
function mfClean(v){
  if(typeof v === "string") return v.replace(/\r\n/g, "\n").trim();
  if(Array.isArray(v)) return v.map(mfClean);
  if(v && typeof v === "object"){
    const out = {};
    Object.keys(v).forEach(k => { out[k] = mfClean(v[k]); });
    return out;
  }
  return v;
}

async function saveManifestoEditor(ed){
  const statusEl = document.getElementById("saveStatus");
  const item = mfClean(ed.item);
  item.counts.chain = item.counts.chain.filter(s => s);
  item.counts.items = item.counts.items.filter(it => it.value || it.label || it.en);
  ed.item = item;

    const content = utf8ToBase64(JSON.stringify(item, null, 2) + "\n");

// 「團隊介紹」的兩個固定單位（跟前台 src/lib/projects.ts 的 TEAM_UNITS 一致），存在 chapter.units：
// [{ key, text, images }]。文字照輸入的換行顯示、不切段落；圖片排在文字右邊。
const TEAM_UNITS = [
  { key: "designer", label: "設計單位" },
  { key: "builder", label: "施工單位" },
  { key: "owner", label: "業主單位" },
];
function teamUnit(chapter, key){
  chapter.units = chapter.units || [];
  let unit = chapter.units.find(u => u.key === key);
  if(!unit){
    unit = { key, name: "", text: "", images: [] };
    chapter.units.push(unit);
  }
  return unit;
}

function emptyChapter(key, label){
  return { key, title: label, text: "", images: [], moreImages: [] };
}

async function openCaseEditor(slug){
  try{
    setLoading(true, "載入案例中…");
    const { json, sha } = await ghGetFile(`content/projects/${slug}.json`);
    // 補齊固定章節（新增的「團隊介紹」「結構設計」、或資料裡缺了某一章，畫面上還是要看得到、能補上去），
    // 順序照 CHAPTER_DEFS；存檔時 chapters 陣列就會是這個順序
    const chapters = CHAPTER_DEFS.map(def => {
      const existing = (json.chapters || []).find(c => c.key === def.key);
      return existing || emptyChapter(def.key, def.label);
    });
    state.editingCase = { slug, item: Object.assign({}, json, { chapters }), sha };
    render();
  }catch(err){
    toast(err.message || "載入失敗", true);
  }finally{
    setLoading(false);
  }
}

// 文字份量決定照片上限——跟前台 lib/photoLayout.ts 的 maxPhotosForText()
// 用同一條公式，讓後台這裡看到的上限提示跟畫面上實際會顯示的張數一致。
function maxPhotosForText(text){
  const len = [...String(text || "")].length;
  if(len <= 300) return 2;
  return 2 + Math.floor((len - 300) / 100);
}

/* 首頁封面實際會用哪一張（跟前台 lib/projects.ts 的 homeCover 同一套規則）：指定的 homeCoverId
   還在清單裡、有圖就用它，否則用最後一張有圖的。 */
function effectiveHomeCoverId(item){
  const withSrc = (item.coverImages || []).filter(c => c.src);
  const picked = withSrc.find(c => c.id === item.homeCoverId);
  const img = picked || withSrc[withSrc.length - 1] || (item.coverImages || [])[0];
  return img ? img.id : "";
}

function renderPhotoList(containerId, images, opts){
  opts = opts || {};
  return `
    <div class="photo-list" id="${containerId}">
      ${(images || []).map((img, i, all) => `
        <div class="photo-row" data-idx="${i}">
          <div class="row-drag-handle" data-drag-handle title="拖曳調整順序">⠿</div>
          <div class="thumb">${img.src ? `<img src="${esc(img.src)}" alt="">` : "沒有圖"}</div>
          <div class="fields">
            <input type="text" data-field="caption" placeholder="圖說（選填）" value="${esc(img.caption || "")}">
            <input type="text" data-field="src" placeholder="圖片網址（用下面「上傳」按鈕自動填入，也可以手動貼）" value="${esc(img.src || "")}">
            ${opts.kind ? `
            <select data-field="kind" title="首頁電腦版的版型：照片會裁切填滿框、圖說完整顯示不裁切">
              <option value="" ${!img.kind ? "selected" : ""}>類型：自動判斷</option>
              <option value="photo" ${img.kind === "photo" ? "selected" : ""}>類型：照片（裁切填滿）</option>
              <option value="drawing" ${img.kind === "drawing" ? "selected" : ""}>類型：圖說（完整不裁切）</option>
            </select>` : ""}
            ${opts.coverId !== undefined ? `
            <label class="checkbox-row" style="font-size:12.5px">
              <input type="radio" name="homeCoverPick" data-cover-pick="${esc(img.id)}" ${img.id === opts.coverId ? "checked" : ""}> 首頁封面
            </label>` : ""}
          </div>
          <div class="row-move">
            <button type="button" class="row-move-btn" data-move="${i}" data-dir="-1" title="往前移" ${i === 0 ? "disabled" : ""}>↑</button>
            <button type="button" class="row-move-btn" data-move="${i}" data-dir="1" title="往後移" ${i === all.length - 1 ? "disabled" : ""}>↓</button>
          </div>
          <button type="button" class="row-remove-btn" data-remove="${i}" title="移除這張">✕</button>
        </div>
      `).join("") || `<div class="field-hint">目前沒有照片。</div>`}
    </div>
    <button type="button" class="add-photo-btn" data-upload-target="${containerId}">＋ 上傳照片／影片</button>
    <input type="file" accept="image/*,video/*" multiple style="display:none" data-upload-input="${containerId}">
  `;
}

/* 「影片」章節的影片清單：輸入框即時同步回 chapter.videos，新增／移除／↑↓ 調整順序後重畫（保留其他
   還沒存檔的文字，見 rerenderKeepingEdits）。 */
function wireVideoList(chapter){
  const list = document.getElementById("videoList");
  const addBtn = document.getElementById("addVideoBtn");
  if(!list || !addBtn) return;
  chapter.videos = chapter.videos || [];
  list.addEventListener("input", (e) => {
    const row = e.target.closest("[data-vidx]");
    const field = e.target.dataset.vfield;
    if(!row || !field) return;
    chapter.videos[Number(row.dataset.vidx)][field] = e.target.value;
  });
  list.addEventListener("click", (e) => {
    const rm = e.target.closest("[data-vremove]");
    if(rm){
      chapter.videos.splice(Number(rm.dataset.vremove), 1);
      rerenderKeepingEdits();
      return;
    }
    const mv = e.target.closest("[data-vmove]");
    if(mv && !mv.disabled){
      const from = Number(mv.dataset.vmove);
      const to = from + Number(mv.dataset.dir);
      const [v] = chapter.videos.splice(from, 1);
      chapter.videos.splice(to, 0, v);
      rerenderKeepingEdits();
    }
  });
  addBtn.addEventListener("click", () => {
    chapter.videos.push({ id: `video-${uid()}`, url: "", title: "" });
    rerenderKeepingEdits();
  });
}

/* 幫一個 photo-list 容器接上：文字欄位即時同步回資料、移除按鈕、調整順序（拖曳把手＋上下移按鈕）、
   上傳按鈕。
   getList/setList 讓呼叫端決定這份清單實際存在資料的哪個位置（coverImages
   或某一章的 images／moreImages），這裡不用知道細節，只管清單本身怎麼編輯。*/
function wirePhotoList(containerId, getList, setList, slug){
  const container = document.getElementById(containerId);
  if(!container) return;
  container.addEventListener("input", (e) => {
    const row = e.target.closest(".photo-row");
    if(!row) return;
    const idx = Number(row.dataset.idx);
    const field = e.target.dataset.field;
    if(!field) return;
    const list = getList().slice();
    list[idx] = Object.assign({}, list[idx], { [field]: e.target.value });
    // 「類型：自動判斷」不存欄位（前台沒有 kind 就自動判斷），避免 JSON 裡留一堆空字串
    if(field === "kind" && !e.target.value) delete list[idx].kind;
    setList(list);
  });
  // 把清單裡第 from 張移到第 to 個位置（to 是移除之後的索引），再重畫
  function moveItem(from, to){
    const list = (getList() || []).slice();
    if(from === to || from < 0 || from >= list.length) return;
    const [item] = list.splice(from, 1);
    list.splice(Math.max(0, Math.min(list.length, to)), 0, item);
    setList(list);
    rerenderKeepingEdits();
  }

  container.addEventListener("click", (e) => {
    const removeBtn = e.target.closest("[data-remove]");
    if(removeBtn){
      const list = (getList() || []).slice();
      list.splice(Number(removeBtn.dataset.remove), 1);
      setList(list);
      rerenderKeepingEdits();
      return;
    }
    const moveBtn = e.target.closest("[data-move]");
    if(moveBtn && !moveBtn.disabled){
      const idx = Number(moveBtn.dataset.move);
      moveItem(idx, idx + Number(moveBtn.dataset.dir));
    }
  });

  // 拖曳排序：只有按住左側把手（⠿）時整列才可拖，避免在輸入框裡選字時誤觸拖曳。
  // 放下的位置依滑鼠在目標列的上半部／下半部決定插在它前面或後面，拖曳中用一條粗線提示。
  let dragFrom = null;
  const clearMarks = () => container.querySelectorAll(".drop-before, .drop-after").forEach(r => r.classList.remove("drop-before", "drop-after"));
  container.addEventListener("mousedown", (e) => {
    const handle = e.target.closest("[data-drag-handle]");
    if(handle) handle.closest(".photo-row").draggable = true;
  });
  container.addEventListener("dragstart", (e) => {
    const row = e.target.closest(".photo-row");
    if(!row || !row.draggable){ e.preventDefault(); return; }
    dragFrom = Number(row.dataset.idx);
    row.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(dragFrom));
  });
  container.addEventListener("dragover", (e) => {
    if(dragFrom === null) return;
    const row = e.target.closest(".photo-row");
    if(!row) return;
    e.preventDefault();
    clearMarks();
    const r = row.getBoundingClientRect();
    row.classList.add(e.clientY < r.top + r.height / 2 ? "drop-before" : "drop-after");
  });
  container.addEventListener("drop", (e) => {
    if(dragFrom === null) return;
    const row = e.target.closest(".photo-row");
    if(!row) return;
    e.preventDefault();
    const target = Number(row.dataset.idx);
    const r = row.getBoundingClientRect();
    let to = e.clientY < r.top + r.height / 2 ? target : target + 1;
    if(dragFrom < to) to -= 1; // 先拿掉自己，後面的索引往前退一格
    const from = dragFrom;
    dragFrom = null;
    clearMarks();
    moveItem(from, to);
  });
  container.addEventListener("dragend", () => {
    dragFrom = null;
    clearMarks();
    container.querySelectorAll(".photo-row").forEach(r => { r.draggable = false; r.classList.remove("dragging"); });
  });
  const uploadBtn = document.querySelector(`[data-upload-target="${containerId}"]`);
  const uploadInput = document.querySelector(`[data-upload-input="${containerId}"]`);
  if(uploadBtn && uploadInput){
    uploadBtn.addEventListener("click", () => uploadInput.click());
    uploadInput.addEventListener("change", async () => {
      const files = Array.from(uploadInput.files || []);
      if(files.length === 0) return;
      try{
        setLoading(true, `上傳中… 0 / ${files.length}`);
        const list = (getList() || []).slice();
        for(let i = 0; i < files.length; i++){
          setLoading(true, `上傳中… ${i + 1} / ${files.length}`);
          const src = await uploadAsset(files[i], slug);
          list.push({ id: `${slug}-${uid()}`, tone: "bg-neutral-300", caption: "", src });
        }
        setList(list);
        rerenderKeepingEdits();
        toast(`已上傳 ${files.length} 個檔案`);
      }catch(err){
        toast(err.message || "上傳失敗", true);
      }finally{
        setLoading(false);
      }
    });
  }
}

/* 照片清單有變動（調整順序、移除、上傳）時整頁重畫，但要保住兩件事：
   1. 案例編輯器裡還沒存檔、只存在畫面上的文字（案名、內文、章節文字等只在存檔時才從畫面讀
      回資料，見 collectEditorFields）——重畫前先讀回去，不然會被洗掉
   2. 捲動位置——不然每排一次順序就跳回頁面最上面 */
function rerenderKeepingEdits(){
  if(state.editingCase && document.getElementById("f_name")) collectEditorFields(state.editingCase);
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

function collectEditorFields(ed){
  const item = ed.item;
  item.name = document.getElementById("f_name").value.trim();
  item.slug = document.getElementById("f_slug").value.trim();
  item.shortLabel = document.getElementById("f_shortLabel").value.trim();
  item.location = document.getElementById("f_location").value.trim();
  item.year = document.getElementById("f_year").value.trim();
  item.type = document.getElementById("f_type").value.trim();
  item.accent = document.getElementById("f_accent").value.trim();
  item.titleAlign = document.getElementById("f_titleAlign").value;
  item.published = document.getElementById("f_published").checked;
  item.intro = document.getElementById("f_intro").value;

  const lat = document.getElementById("f_coord_lat").value.trim();
  const lng = document.getElementById("f_coord_lng").value.trim();
  const address = document.getElementById("f_coord_address").value.trim();
  const zoom = document.getElementById("f_coord_zoom").value.trim();
  if(lat && lng){
    item.coordinates = { lat: Number(lat), lng: Number(lng) };
    if(address) item.coordinates.address = address;
    if(zoom) item.coordinates.zoom = Number(zoom);
    const place = document.getElementById("f_coord_place").value.trim();
    if(place) item.coordinates.place = place;
    const street = document.getElementById("f_coord_street").value.trim();
    if(street) item.coordinates.street = street;
  }else{
    delete item.coordinates;
  }

  // 用 data-chapter（章節 key）對應資料，不用畫面上第幾個區塊——（2026-10-15）「核心目標」也用了
  // chapter-section 的外框，照順序對會整排錯位一格（團隊介紹的欄位被寫到設計概念，丟錯誤、刪改圖片跟存檔都失效）
  document.querySelectorAll(".chapter-section[data-chapter]").forEach((section) => {
    const chapter = item.chapters.find(c => c.key === section.dataset.chapter);
    if(!chapter) return;
    section.querySelectorAll("[data-ufield]").forEach(el => {
      teamUnit(chapter, el.dataset.ufield).text = el.value.replace(/\r\n/g, "\n");
    });
    section.querySelectorAll("[data-uname]").forEach(el => {
      teamUnit(chapter, el.dataset.uname).name = el.value.trim();
    });
    section.querySelectorAll("[data-cfield]").forEach(el => {
      const f = el.dataset.cfield;
      if(f === "pdfUrl"){
        chapter.pdf = Object.assign({}, chapter.pdf, { url: el.value.trim() });
      }else if(f === "pdfLabel"){
        chapter.pdf = Object.assign({}, chapter.pdf, { label: el.value.trim() });
      }else{
        chapter[f] = el.value;
      }
    });
    // 影片一律放「影片」章節：舊的單一影片欄位不再使用，拿掉（影片清單的空列在存檔時才清，見 saveCaseEditor——
    // 這個函式在每次重畫前也會跑，這裡清的話剛按「新增影片」的空白列會馬上消失）
    delete chapter.video;
    if(chapter.pdf && !chapter.pdf.url && !chapter.pdf.label) delete chapter.pdf;
    // 沒有照片就不留空陣列以外的雜訊，moreImages 全空就整個拿掉這個欄位
    if(!chapter.moreImages || chapter.moreImages.length === 0) delete chapter.moreImages;
  });
}

async function saveCaseEditor(ed){
  collectEditorFields(ed);
  // 影片章節：清掉沒填網址的空列、整理欄位
  ed.item.chapters.forEach(chapter => {
    if(!chapter.videos) return;
    chapter.videos = chapter.videos
      .map(v => ({ id: v.id || `video-${uid()}`, url: (v.url || "").trim(), title: (v.title || "").trim() }))
      .filter(v => v.url);
    if(chapter.videos.length === 0) delete chapter.videos;
  });
  const statusEl = document.getElementById("saveStatus");
  try{
    setLoading(true, "儲存中…");
    statusEl.classList.remove("err");
    statusEl.textContent = "儲存中…";
    const path = `content/projects/${ed.slug}.json`;
    const content = utf8ToBase64(JSON.stringify(ed.item, null, 2) + "\n");
    const result = await ghPutFile(path, content, `Update case ${ed.slug} via bamboo admin`, ed.sha);
    ed.sha = result.content ? result.content.sha : ed.sha;
    statusEl.textContent = "已儲存 " + new Date().toLocaleTimeString("zh-TW");
    toastSaved();
    await loadCaseList();
  }catch(err){
    statusEl.classList.add("err");
    statusEl.textContent = "儲存失敗";
    toast(err.message || "儲存失敗", true);
  }finally{
    setLoading(false);
  }
}

async function deleteCaseEditor(ed){
  if(!confirm(`確定要刪除案例「${ed.item.name || ed.slug}」嗎？這個動作會直接從 GitHub 上移除這個案例的資料檔，不能復原。`)) return;
  try{
    setLoading(true, "刪除中…");
    await ghDeleteFile(`content/projects/${ed.slug}.json`, `Delete case ${ed.slug} via bamboo admin`, ed.sha);
    toast("已刪除");
    state.editingCase = null;
    await loadCaseList();
    render();
  }catch(err){
    toast(err.message || "刪除失敗", true);
  }finally{
    setLoading(false);
  }
}

/* ============================================================
   啟動
   ============================================================ */
(async function init(){
  // 從另一邊後台帶著 session 交接過來（見 crossAdminUrl() 的說明）——網址上一偵測到
  // 就立刻清掉 hash，不管交接成不成功，都不留在網址列／瀏覽紀錄裡。
  if(HANDOFF_ACCESS_TOKEN && HANDOFF_REFRESH_TOKEN){
    history.replaceState(null, "", location.pathname + location.search);
    try{
      const { data, error } = await sb.auth.setSession({ access_token: HANDOFF_ACCESS_TOKEN, refresh_token: HANDOFF_REFRESH_TOKEN });
      if(error) throw error;
      authSession = data.session;
    }catch(e){
      // 帶過來的 token 失效／過期就算了，退回正常登入畫面，不讓使用者卡住看不懂發生什麼事。
    }
  }
  if(!authSession){
    const { data } = await sb.auth.getSession();
    authSession = data.session;
  }
  if(authSession && !AUTH_LINK_TYPE){
    state.user = { email: authSession.user.email };
    setLoading(true, "載入案例清單中…");
    try{ await loadCaseList(); }catch(e){ toast(e.message || "載入案例清單失敗", true); }
    setLoading(false);
  }
  render();
})();
</script>
